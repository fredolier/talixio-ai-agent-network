# Une version téléchargeable par système : un exécutable par système et par processeur, leurs
# empreintes, et les scripts d'installation, publiés ensemble. Se lance en poussant une étiquette
# `vX.Y.Z`, ou à la main (onglet Actions, « version », « Run workflow ») : la version publiée est
# alors celle de Cargo.toml, étiquetée sur le commit choisi.
name: version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executables:
    name: ${{ matrix.name }}
    # a release starts only from a tag, or from main, the public branch (which need not be the
    # repository's default branch)
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: "" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "" }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: L'étiquette est la version du code
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"
      - name: Compilateur C pour musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Outils Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Compilation
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Linux, aucune dépendance au système
        if: contains(matrix.target, 'musl')
        run: file target/${{ matrix.target }}/release/talixio-agent | grep -q "static"
      - name: Nom de l'exécutable publié
        shell: bash
        run: cp "target/${{ matrix.target }}/release/talixio-agent${{ matrix.ext }}" "talixio-agent-${{ matrix.name }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: talixio-agent-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  publication:
    name: publication
    needs: executables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true
      - name: Empreintes
        run: |
          cp scripts/install.sh scripts/install.ps1 talixio.example.toml sortie/
          cd sortie && sha256sum talixio-agent-* > SHA256SUMS && cat SHA256SUMS
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          # lancée à la main, la publication crée l'étiquette : elle ne reprend jamais une étiquette posée ailleurs
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "L'étiquette $version existe déjà : montez la version dans Cargo.toml." >&2
            exit 1
          fi
          gh release create "$version" sortie/* --target "$GITHUB_SHA" \
            --title "Talixio Agent Network $version" \
            --notes "Notes de version : commande talixio-agent releases, ou écran Nouveautés de l'interface. Empreintes des fichiers : SHA256SUMS."
