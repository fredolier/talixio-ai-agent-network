# Configuration de l'agent maître. Copiez ce fichier en talixio.toml et adaptez-le.
#   talixio-agent root --config talixio.toml

name = "maître"
role = "orchestrateur"
instructions = """
Tu pilotes une grappe d'agents pour le compte de la personne qui te parle.
Délègue ce qui peut l'être à des agents spécialisés, avec le strict minimum de droits.
"""

# Alias du modèle du maître, parmi ceux définis plus bas.
model = "main"

# Adresse de l'API et du lien avec les enfants. Seule l'interface locale est acceptée pour l'instant.
listen = "127.0.0.1:7700"

# Dossier d'état : jeton de l'API, journaux des enfants, bases SQLite (mémoire des agents, journal).
state_dir = ".talixio"

[timing]
heartbeat_secs = 5        # un battement toutes les 5 s
suspend_after_secs = 20   # sans nouvelles du parent : mise en veille
die_after_secs = 300      # toujours sans nouvelles : extinction, descendance comprise

# --- Modèles -------------------------------------------------------------------------------
# Les clés restent chez le maître : les enfants passent par lui pour appeler un modèle.
# La clé n'est jamais écrite ici. Deux façons de la fournir :
#   api_key_file = "/etc/talixio/anthropic.key"   # fichier en 0600, à préférer
#   api_key_env  = "ANTHROPIC_API_KEY"            # variable d'environnement du maître

[models.main]
provider = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "high"

[models.fast]
provider = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"

# Tout serveur compatible OpenAI : OpenAI, Gemini, Mistral, OpenRouter, Ollama, vLLM…
# [models.local]
# provider = "openai"
# base_url = "http://localhost:11434/v1"
# model = "qwen3"

# --- Droits du maître ----------------------------------------------------------------------
# Tout ce qui n'est pas listé est refusé. Un enfant ne reçoit jamais plus que son parent.
# Les dossiers doivent exister ; ils sont figés sur leur chemin réel au démarrage.
# Le dossier d'état et les fichiers de clés restent interdits aux outils, quoi qu'on accorde ici.

[capabilities]
fs_read = ["/srv/projet"]
fs_write = ["/srv/projet/travail"]
# models = ["main", "fast"]   # par défaut : tous les modèles définis ci-dessus
# max_tokens = 5000000         # budget global ; absent : pas de plafond

# Commandes autorisées, sans shell. Le programme est un chemin absolu. Arguments, position par position :
#   "texte"    cet argument exact
#   "*"        un argument libre, jamais une option (rien qui commence par « - »)
#   "{read}"   un chemin que l'agent a le droit de lire ; "{write}" : d'écrire
#   "**"       en dernier : une suite d'arguments libres, sans option
# ATTENTION : une commande autorisée s'exécute avec tous les droits du compte du process, tant
# que le cloisonnement par le système n'est pas en place. Chaque règle est donc à écrire au plus
# serré : jamais d'interpréteur (sh, python…), jamais `args` omis (arguments libres), et se
# méfier des programmes dont une option écrit un fichier ou lance un autre programme.
[[capabilities.exec]]
program = "/usr/bin/git"
args = ["status", "--short"]
cwd = "/srv/projet"          # dossier d'exécution ; absent : le dossier temporaire

[[capabilities.exec]]
program = "/usr/bin/wc"
args = ["-l", "{read}"]

[capabilities.spawn]
max_children = 5   # enfants directs en vie
max_depth = 2      # niveaux sous le maître
