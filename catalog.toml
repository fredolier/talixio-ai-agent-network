# Catalogue des fournisseurs et des modèles que le maître connaît.
#
# Embarqué dans l'exécutable et servi par `GET /api/models`, d'où l'interface le lit. Il ne donne
# aucun droit : un modèle n'est utilisable que s'il est déclaré dans la configuration du maître
# (`[models.<alias>]`, avec sa clé) et accordé à l'agent.
#
# Repris du catalogue de l'assistant Talixio (relevé d'octobre 2026). Les prix sont indicatifs
# (`estimated` : chiffre non confirmé, ou facturé dans une autre monnaie) : vérifier chez le
# fournisseur. `rank` : qualité relative, de 1 (élémentaire) à 10 (le meilleur).
#
# Confiance (`trust`) : 1 grand public · 2 gratuit ou public · 3 professionnel ·
# 4 professionnel sans conservation · 5 souverain (RGPD) · L local (votre propre machine).
# `europe` : hébergé et régi en Europe (niveau 5). `apis` : les familles d'API par lesquelles le
# maître sait l'appeler (`anthropic` ; `openai` pour toute API compatible : texte, transcription,
# voix, image, plongements ; `elevenlabs` : voix ; `timesfm` : prévision ; `systemone` : décision).
# Vide : pas encore appelable.
# `keys_url` : la page où créer une clé chez ce fournisseur. `oauth_authorize`, `oauth_exchange` :
# le fournisseur sait remettre une clé par autorisation dans le navigateur (OAuth avec PKCE), sans
# application à enregistrer ; à ce jour, seul OpenRouter.
# `hosts` : machines qui servent ce fournisseur (un nom qui commence par un point vaut pour ses
# sous-domaines) ; c'est ainsi qu'un modèle configuré est rattaché à son fournisseur.

[[provider]]
id = "mistral"
name = "Mistral AI"
country = "France"
europe = true
trust = "5"
kind = "Souverain (RGPD)"
billing = "usage"
apis = ["openai"]
endpoint = "https://api.mistral.ai/v1"
hosts = ["api.mistral.ai"]
keys_url = "https://console.mistral.ai/api-keys"

[[provider]]
id = "anthropic"
name = "Anthropic"
country = "États-Unis"
europe = false
trust = "4"
kind = "Professionnel, sans conservation"
billing = "usage"
apis = ["anthropic"]
endpoint = "https://api.anthropic.com"
hosts = ["api.anthropic.com"]
keys_url = "https://console.anthropic.com/settings/keys"

