<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<title>Talixio Agents</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<section id="login" hidden>
  <form id="login-form" class="card login">
    <span class="logo" aria-hidden="true"></span>
    <h1>Talixio Agents</h1>
    <p class="muted">Le jeton de l'API se trouve sur la machine du maître, dans <code>.talixio/api-token</code>.</p>
    <label for="token">Jeton</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox"> Rester connecté sur cet appareil</label>
    <p id="login-error" class="error" role="alert" hidden></p>
    <button class="primary" type="submit">Entrer</button>
  </form>
</section>

<div id="app" hidden>
  <nav aria-label="Navigation">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>Talixio Agents</span></div>
    <button data-view="tree" class="active">Grappe</button>
    <button data-view="chat">Dialogue</button>
    <button data-view="journal">Journal</button>
    <button data-view="releases">Nouveautés <span id="version" class="pill dark"></span></button>
    <span class="grow"></span>
    <button id="logout" class="quiet">Se déconnecter</button>
  </nav>
  <main>
    <p id="offline" class="banner" role="status" hidden>Maître injoignable. Nouvel essai en cours…</p>

    <section id="view-tree">
      <header><div><h1>La grappe</h1><p id="summary" class="muted"></p></div><div id="counts" class="pills"></div></header>
      <div class="split">
        <div id="agents" class="list" aria-label="Agents"></div>
        <aside id="detail" class="card" aria-live="polite"></aside>
      </div>
    </section>

    <section id="view-chat" hidden>
      <header><div><h1>Dialogue avec le maître</h1><p class="muted">Vos messages, et ses réponses.</p></div></header>
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <textarea id="chat-text" rows="2" placeholder="Écrire au maître…" aria-label="Message au maître" required></textarea>
        <button class="primary" type="submit">Envoyer</button>
      </form>
    </section>

    <section id="view-journal" hidden>
      <header><div><h1>Journal</h1><p class="muted">Tout ce qui remonte de la grappe, en direct.</p></div>
        <input id="filter" type="search" placeholder="Filtrer…" aria-label="Filtrer le journal"></header>
      <div id="journal" class="card journal"></div>
    </section>

    <section id="view-releases" hidden>
      <header><div><h1>Nouveautés</h1><p id="running" class="muted"></p></div></header>
      <div id="releases" class="timeline"></div>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
